[project]
name = "fundo-ai-reviewer"
version = "0.1.0"
description = "Hybrid Deterministic + LLM Reviewer for SMB Plaid Transaction Auditing & Credit Impact"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "google-genai>=0.1.0",
    "openai>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
